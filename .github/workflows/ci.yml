name: ci

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux X11/GL/audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libasound2-dev ninja-build

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build goose
        shell: bash
        run: |
          git clone --depth 1 https://github.com/aardappel/goose.git "$RUNNER_TEMP/goose"
          cmake -S "$RUNNER_TEMP/goose" -B "$RUNNER_TEMP/goose/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/goose/build" --config Release -j 4
          # multi-config generators put the binary in Release/
          echo "$RUNNER_TEMP/goose/build" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/goose/build/Release" >> "$GITHUB_PATH"

      - name: Regenerate the binding
        run: python tools/gen_bindings.py

      - name: Build every example
        shell: bash
        run: |
          for f in examples/basic.goose examples/demo.goose examples/hard_cases.goose examples/smoke.goose; do
            goose build "$f"
          done

      - name: Run the headless smoke test
        shell: bash
        run: |
          exe=examples/smoke
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "./$exe"
